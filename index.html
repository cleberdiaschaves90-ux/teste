<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semáforo Interativo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .semaforo {
            background-color: #222;
            width: 120px;
            padding: 20px;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .luz {
            width: 80px;
            height: 80px;
            background-color: #444;
            border-radius: 50%;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
    </style> <!-- Tag de fechamento corrigida aqui -->
</head>
<body>

    <div class="semaforo">
        <div id="vermelho" class="luz"></div>
        <div id="amarelo" class="luz"></div>
        <div id="verde" class="luz"></div>
    </div>

    <script>
        const luzVermelha = document.getElementById("vermelho");
        const luzAmarela = document.getElementById("amarelo");
        const luzVerde = document.getElementById("verde");

        function apagarTodas() {
            luzVermelha.style.backgroundColor = "#444";
            luzVermelha.style.boxShadow = "none";
            
            luzAmarela.style.backgroundColor = "#444";
            luzAmarela.style.boxShadow = "none";
            
            luzVerde.style.backgroundColor = "#444";
            luzVerde.style.boxShadow = "none";
        }

        function iniciarSemaforo() {
            apagarTodas();
            luzVermelha.style.backgroundColor = "#ff3333";
            luzVermelha.style.boxShadow = "0 0 30px #ff3333";

            setTimeout(() => {
                apagarTodas();
                luzVerde.style.backgroundColor = "#33ff33";
                luzVerde.style.boxShadow = "0 0 30px #33ff33";
            }, 4000);

            setTimeout(() => {
                apagarTodas();
                luzAmarela.style.backgroundColor = "#ffcc00";
                luzAmarela.style.boxShadow = "0 0 30px #ffcc00";
            }, 7000);
        }

        iniciarSemaforo();
        setInterval(iniciarSemaforo, 9000);
    </script>
</body>
</html>
