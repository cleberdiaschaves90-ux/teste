<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Blog Tech</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
      }
      header {
        background-color: #183c63;
        color: #ffffff;
        text-align: center;
        max-width: 800px;
        margin: 20px auto;
        border: 5px solid #cf1010;
        padding: 16px;
      }
      main {
        background-color: #ffffff;
        color: #183c63;
        max-width: 800px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ddd;
      }
      .post {
        margin-bottom: 20px;
      }
      .autor {
        font-style: italic;
        color: #555;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Meu Blog Tech</h1>
      <p>Vou compartilhar conhecimentos sobre tecnologia e programação</p>
    </header>

    <main>
      <section class="post">
        <img
          src="https://recreio.com.br/wp-content/uploads/2024/05/goku_capa-1.jpg"
          alt="Imagem de destaque do post"
          style="width: 100%; height: auto"
        />
        <h2>Meu primeiro post</h2>
        <p class="autor">Por: Cleber Dias Chaves</p>
        <p>
          Boas-vindas ao meu novo blog! Aqui vou compartilhar dicas de
          programação e curiosidades na área de tecnologia.
        </p>
      </section>
    </main>
  </body>
</html>
